# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Chatify CD

on:
  push:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - name : Checkout Repo 
      uses: actions/checkout@v4
    
    - name : Install Docker
      uses: docker/setup-buildx-action@v3

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      
    - name: Build the api images
      run : docker build -t rajd0311/chatify-api:${{ github.sha }} -f docker/Dockerfile.api .
    - name: Build the ws images
      run : docker build -t rajd0311/chatify-ws:${{ github.sha }} -f docker/Dockerfile.ws .
    - name: Build the data-patch images
      run : docker build -t rajd0311/chatify-data-patch:${{ github.sha }} -f docker/Dockerfile.data-patch .

    - name : Push the images to hub
      run : |
        docker push rajd0311/chatify-api:${{ github.sha }}
        docker push rajd0311/chatify-ws:${{ github.sha }}
        docker push rajd0311/chatify-data-patch:${{ github.sha }}
