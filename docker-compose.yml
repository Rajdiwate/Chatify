version: 3.8'
services:
  redis:
    image: redis
    ports:
      - 6379:6379

  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - 5432:5432

  kafka:
    image: apache/kafka:latest
    ports:
      - 9092:9092
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  http-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - 3000:3000
    depends_on:
      - postgres
      - redis
    environment:
      JWT_SECRET: fjonrojfnwrojvirnjvirjfreopif
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/postgres"

  ws-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    ports:
      - 3001:3001
    depends_on:
      kafka :
        condition: service_healthy
      redis : 
        condition : service_started
      http-server :
        condition : service_started 
    environment:
      JWT_SECRET: fjonrojfnwrojvirnjvirjfreopif
      REDIS_URL: "redis://redis:6379"
      KAFKA_URL: "kafka:9092"
      MAIN_TOPIC: "persist"

  data-patch:
    build:
      context: .
      dockerfile: docker/Dockerfile.data-patch
    depends_on:
      kafka :
        condition: service_healthy
      ws-server : 
        condition: service_started
    environment:
      KAFKA_URL: "kafka:9092"
      MAIN_TOPIC: "persist"
      TIME_THRESHOLD: "2*24*60*60*1000"
      LENGTH_THRESHOLD: "20"
      RETRY_TOPIC: "retry"
      MAIN_CONSUMER_GROUP_ID: "data-patch-service"
      RETRY_CONSUMER_GROUP_ID: "data-patch-service-retry"
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/postgres"
